name: lint and test

on:
  push: 
    branches: ["**"]

  pull_request:
    branches: ["main", "dev"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up
        uses: actions/setup-go@v5
        with:
          go-versions: 'stable'

  test:
    name: Test on Linux with Go 1.27.2
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27.2'
      - uses: actions/checkout@v4 
      - name: Test
        run: go test -v ./... 